<!DOCTYPE html>
<html lang="en">
<head>

                    <div class="card-body">
                        <form id="movieForm">

                                <label for="movieInput">Enter your Movie:</label>

                            <button type="button" id="btnUpdate" class="btn btn-sm btn-block btn-danger d-none">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card cardMovie">
                    <div class="card-body">
                        <ul class="list-group" id="listMovie">

                            </li> -->
